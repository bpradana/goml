name: Metal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: [self-hosted, macOS, ARM64, metal]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.15
          install_args: "--locked"
      - run: mise run fmt:check:metal
      - run: mise run build:gpu:metal
      - run: mise run lint:gpu:metal
      - run: mise run lint:gpu:examples
      - run: mise run test:gpu:metal
      - run: mise run test:gpu:parity
      - run: mise run test:gpu:race
      - run: mise run test:gpu:portable
      - run: mise run lint:mnist:metal
      - run: mise run test:data:metal
      - run: mise run test:trainer:metal
