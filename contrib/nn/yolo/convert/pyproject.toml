[project]
name = "goml-yolo-convert"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ultralytics==8.3.0", "torch==2.5.1", "numpy==1.26.4", "torchvision==0.20.1"]

[dependency-groups]
dev = ["ruff==0.14.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
