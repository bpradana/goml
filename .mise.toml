[tasks."test:simd"]
description = "Test experimental SIMD"
env = { GOEXPERIMENT = "simd" }
run = [
  "go test ./simdops/...",
  "go test ./tensor/...",
  "go test ./nn/...",
  "go test ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/..."
]

[tasks."vet"]
description = "Run go vet"
run = [
  "go vet ./simdops/...",
  "go vet ./tensor/...",
  "go vet ./nn/...",
  "go vet ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/... ./example/..."
]

[tasks."security:vuln"]
description = "Run vulnerability analysis"
run = [
  "cd simdops && govulncheck ./...",
  "cd tensor && govulncheck ./...",
  "cd nn && govulncheck ./...",
  "cd contrib/nn/yolo && govulncheck ./...",
  "cd data && govulncheck ./...",
  "cd nn/examples/mnist && govulncheck ./...",
  "cd metrics && govulncheck ./...",
  "cd trainer && govulncheck ./..."
]

[tasks."test:standalone"]
description = "Test versioned dependencies without workspace"
env = { GOWORK = "off" }
run = [
  "cd simdops && go test ./...",
  "cd tensor && go test ./...",
  "cd nn && go test ./...",
  "cd data && go test ./...",
  "cd metrics && go test ./...",
  "cd trainer && go test ./..."
]

[tasks."test:fuzz"]
description = "Fuzz tensor layouts, views, checkpoint files, and network metadata"
run = [
  "go test -run '^$' -fuzz '^FuzzShapes$' -fuzztime=3s -parallel=2 ./tensor/internal/shape",
  "go test -run '^$' -fuzz '^FuzzBroadcast$' -fuzztime=3s -parallel=2 ./tensor/internal/shape",
  "go test -run '^$' -fuzz '^FuzzViewLayout$' -fuzztime=3s -parallel=2 ./tensor/backend",
  "go test -run '^$' -fuzz '^FuzzViews$' -fuzztime=3s -parallel=2 ./tensor",
  "go test -run '^$' -fuzz '^FuzzUnmarshal$' -fuzztime=3s -parallel=2 ./nn/checkpoint",
  "go test -run '^$' -fuzz '^FuzzRestore$' -fuzztime=3s -parallel=2 ./nn/layer",
  "go test -run '^$' -fuzz '^FuzzLoadArchive$' -fuzztime=3s -parallel=2 ./contrib/nn/yolo"
]

[tasks."example:tensor"]
description = "Run tensor and matrix multiplication basics"
dir = "tensor"
run = "go run ./examples/basics"

[tasks."example:linear"]
description = "Train linear regression"
dir = "nn"
