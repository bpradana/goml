dir = "nn"
run = ["golangci-lint fmt ./...", "golangci-lint run --enable-only wsl_v5 --fix ./..."]

[tasks."fmt:check"]
description = "Check Go formatting"
run = "files=$(golangci-lint fmt --diff ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/... ./example/...) && test -z \"$files\" || { printf \"%s\\n\" \"$files\"; exit 1; }"

[tasks."test:race"]
