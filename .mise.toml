[settings]
lockfile = true

[tools]
go = "1.27.3"
uv = "0.9.1"
"golangci-lint" = "2.15.0"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/sonatype-nexus-community/nancy" = "latest"
"go:go.uber.org/mock/mockgen" = "latest"

[tasks."build"]
description = "build all modules"
run = [
  { task = "build:simdops" },
  { task = "build:tensor" },
  { task = "build:nn" },
  { task = "build:yolo" },
  { task = "build:data" },
  { task = "build:metrics" },
  { task = "build:trainer" },
  { task = "build:mnist" },
  { task = "build:example" }
]

[tasks."build:simdops"]
description = "build simdops"
dir = "simdops"
run = "go build ./..."

[tasks."build:tensor"]
description = "build tensor"
dir = "tensor"
run = "go build ./..."

[tasks."build:nn"]
description = "build nn"
dir = "nn"
run = "go build ./..."

[tasks."build:portable"]
description = "Cross-compile Linux amd64 and arm64 without CGo, with and without SIMD"
run = [
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/...",
  "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/...",
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOEXPERIMENT=simd go build ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/...",
  "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOEXPERIMENT=simd go build ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/..."
]

[tasks."test"]
description = "test all modules"
run = [
  { task = "test:simdops" },
  { task = "test:tensor" },
  { task = "test:nn" },
  { task = "test:yolo" },
  { task = "test:data" },
  { task = "test:metrics" },
  { task = "test:trainer" },
  { task = "test:mnist" },
  { task = "test:example" }
]

[tasks."test:simdops"]
description = "test simdops"
dir = "simdops"
run = "go test ./..."

[tasks."test:tensor"]
description = "test tensor"
dir = "tensor"
run = "go test ./..."

[tasks."test:nn"]
description = "test nn"
dir = "nn"
run = "go test ./..."

[tasks."lint"]
description = "lint all modules"
run = [
  { task = "lint:simdops" },
  { task = "lint:tensor" },
  { task = "lint:nn" },
  { task = "lint:yolo" },
  { task = "lint:data" },
  { task = "lint:metrics" },
  { task = "lint:trainer" },
  { task = "lint:mnist" },
  { task = "lint:example" }
]

[tasks."lint:simdops"]
description = "lint simdops"
dir = "simdops"
run = "golangci-lint run ./..."

[tasks."lint:tensor"]
description = "lint tensor"
dir = "tensor"
run = "golangci-lint run ./..."

[tasks."lint:nn"]
description = "lint nn"
dir = "nn"
run = "golangci-lint run ./..."

[tasks."bench"]
description = "bench all modules"
run = [
  { task = "bench:simdops" },
  { task = "bench:tensor" },
  { task = "bench:nn" },
  { task = "bench:yolo" },
  { task = "bench:data" },
  { task = "bench:metrics" },
  { task = "bench:trainer" }
]

[tasks."bench:simdops"]
description = "bench simdops"
dir = "simdops"
run = "go test -run '^$' -bench=. -benchmem ./..."

[tasks."bench:tensor"]
description = "bench tensor"
dir = "tensor"
run = "go test -run '^$' -bench=. -benchmem ./..."

[tasks."bench:nn"]
description = "bench nn"
dir = "nn"
run = "go test -run '^$' -bench=. -benchmem ./..."

[tasks."bench:matmul"]
description = "Benchmark square, rectangular, small, and strided matrix products"
run = "go test -run '^$' -bench=MatMul -benchmem ./tensor"

[tasks."bench:conv2d"]
description = "Benchmark Conv2D inference and backward at CNN and YOLO sizes"
run = [
  "go test -run '^$' -bench=ConvolutionStrategies -benchmem ./tensor",
  "go test -run '^$' -bench=BenchmarkConv2D -benchmem ./nn/layer"
]

[tasks."bench:autograd"]
description = "Benchmark eager forward and backward"
run = "go test -run '^$' -bench=ForwardBackward -benchmem ./nn"

[tasks."bench:optimizer"]
description = "Benchmark SGD and Adam steps separately from training"
run = "go test -run '^$' -bench=OptimizerStep -benchmem ./nn/optimizer"

[tasks."bench:attention"]
description = "Benchmark Transformer inference and training"
run = "go test -run '^$' -bench=AdvancedLayers/TransformerEncoder -benchmem ./nn/layer"

[tasks."bench:inference"]
description = "Benchmark Dense, CNN, recurrent, and Transformer inference"
run = "go test -run '^$' -bench='Sequential/Inference|AdvancedLayers/.*/Inference' -benchmem ./nn/layer"

[tasks."fmt"]
description = "Format Go sources"
run = [
  { task = "fmt:simdops" },
  { task = "fmt:tensor" },
  { task = "fmt:nn" },
  { task = "fmt:yolo" },
  { task = "fmt:data" },
  { task = "fmt:metrics" },
  { task = "fmt:trainer" },
