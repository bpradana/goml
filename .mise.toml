run = "golangci-lint run ./..."

[tasks."test:gpu:webgpu:race"]
description = "Run WebGPU tests with the race detector on hardware"
dir = "contrib/backend/webgpu"
env = { GOML_WEBGPU_REQUIRED = "1" }
run = "go test -race ./..."

[tasks."test:gpu:webgpu:portable"]
description = "Check WebGPU stubs and desktop cross-builds without CGo"
dir = "contrib/backend/webgpu"
env = { CGO_ENABLED = "0", GOML_WEBGPU_REQUIRED = "0" }
run = ["go test ./...", "GOOS=linux GOARCH=amd64 go build ./...", "GOOS=windows GOARCH=amd64 go build ./...", "GOOS=js GOARCH=wasm go build ./..."]

[tasks."bench:gpu:webgpu"]
description = "Benchmark WebGPU initialization, resident operations, and transfers"
dir = "contrib/backend/webgpu"
env = { GOML_WEBGPU_REQUIRED = "1" }
run = "go test -run '^$' -bench=. -benchmem -benchtime=200ms -count=3 ./..."

[tasks."fmt:check:webgpu"]
description = "Check WebGPU backend and example formatting"
run = 'files=$(golangci-lint fmt --diff ./contrib/backend/webgpu/... ./contrib/backend/webgpu/examples/...) && test -z "$files" || { printf "%s\n" "$files"; exit 1; }'

