dir = "nn"
run = "go run ./examples/lstm"

[tasks."example:transformer"]
description = "Train a transformer encoder on position-dependent recall"
dir = "nn"
run = "go run ./examples/transformer"

[tasks."bench:record"]
description = "Record hardware metadata and repeated scalar/SIMD benchmarks"
run = '''
set -eu
directory="${GOML_BENCH_DIR:-benchmark-results/$(date -u '+%Y%m%dT%H%M%SZ')}"
mkdir -p "$directory"
{
  date -u '+%Y-%m-%dT%H:%M:%SZ'
  git log -1 --format=source_commit=%H
  git status --short
  go version
  go env GOOS GOARCH GOAMD64 GOARM64 GOFLAGS CGO_ENABLED GOEXPERIMENT
  printf 'GOMAXPROCS=%s\nGOML_YOLO_MODEL=%s\nbenchtime=100ms count=3 package_parallelism=1\n' "${GOMAXPROCS:-runtime default}" "${GOML_YOLO_MODEL:-unset (model benchmarks skipped)}"
  uname -a
  if command -v lscpu >/dev/null 2>&1; then lscpu; else sysctl -n machdep.cpu.brand_string; fi
} > "$directory/hardware.txt"
git diff --binary > "$directory/source.diff"
git ls-files --cached --others --exclude-standard -z | tar -czf "$directory/source.tar.gz" --null -T -
go test -p=1 -run '^$' -bench=. -benchmem -benchtime=100ms -count=3 ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/... > "$directory/scalar.txt"
GOEXPERIMENT=simd go test -p=1 -run '^$' -bench=. -benchmem -benchtime=100ms -count=3 ./simdops/... ./tensor/... ./nn/... ./contrib/nn/yolo/... ./data/... ./metrics/... ./trainer/... ./nn/examples/mnist/... > "$directory/simd.txt"
printf 'Recorded benchmarks in %s\n' "$directory"
'''

