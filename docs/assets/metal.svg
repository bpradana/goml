<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="metal">
  <title>metal</title>
  <desc>A silver compute chip containing three parallel numerical lanes.</desc>
  <rect x="12" y="12" width="72" height="72" rx="2" fill="#31485d" stroke="#a8c2d4" stroke-width="3"/>
  <g fill="#d7e8f1">
    <rect x="24" y="24" width="12" height="12" rx="2"/>
    <rect x="42" y="24" width="12" height="12" rx="2"/>
    <rect x="60" y="24" width="12" height="12" rx="2"/>
  </g>
  <g fill="#a8c2d4">
    <rect x="24" y="42" width="12" height="12" rx="2"/>
    <rect x="42" y="42" width="12" height="12" rx="2"/>
    <rect x="60" y="42" width="12" height="12" rx="2"/>
  </g>
  <g fill="#38d9e8">
    <rect x="24" y="60" width="12" height="12" rx="2"/>
    <rect x="42" y="60" width="12" height="12" rx="2"/>
    <rect x="60" y="60" width="12" height="12" rx="2"/>
  </g>
</svg>
